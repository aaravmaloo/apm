name: Build & Release

on:
  push:
    tags:
      - "v*"
      - "can*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: |
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV

      - shell: bash
        run: |
          BASE="apm-${{ github.ref_name }}-${{ matrix.goos }}_${{ matrix.goarch }}"
          export CGO_ENABLED=0

          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="$BASE.exe"
          else
            BINARY="$BASE"
          fi

          go build -ldflags="-s -w" -o "$BINARY"
          chmod +x "$BINARY"

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          BASE="apm-${{ github.ref_name }}-${{ matrix.goos }}_${{ matrix.goarch }}"
          tar -czf "$BASE.tar.gz" "$BASE"

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $BASE = "apm-${{ github.ref_name }}-${{ matrix.goos }}_${{ matrix.goarch }}"
          Compress-Archive -Path "$BASE.exe" -DestinationPath "$BASE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: apm-${{ github.ref_name }}-${{ matrix.goos }}_${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
